<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michael Varón | Tarjeta digital</title>
<meta name="description" content="Michael Varón. Máster en Inteligencia Artificial Generativa Low Code, Universidad Complutense de Madrid.">
<meta name="theme-color" content="#002941">
<meta property="og:title" content="Michael Varón">
<meta property="og:description" content="La inteligencia artificial no reemplaza al humano, amplifica su potencial.">
<meta property="og:image" content="foto.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,800;1,800&display=swap">
<style>
  :root {
    --navy: #002941; --mint: #CFE8E1; --coral: #FD6E6E; --petrol: #1D5C6E;
    /* Unidad de escala: en pantallas bajas todo se reduce en proporción
       para que la tarjeta completa quepa sin hacer scroll. */
    --k: min(1px, calc(100vh / 640));
    --k: min(1px, calc(100dvh / 640));
    /* En pantallas altas, la mitad del espacio sobrante agranda la franja superior
       y la otra mitad queda entre los botones y la frase final. */
    --vh: 100vh; --vh: 100dvh;
    --band: max(calc(var(--k) * 190), calc(var(--k) * 190 + (var(--vh) - var(--k) * 640) / 2));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #CFE8E1; color: var(--navy);
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 430px; min-height: 100vh; min-height: 100dvh;
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    background:
      radial-gradient(95% 42% at 50% 36%, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 72%),
      linear-gradient(180deg, #CFE8E1 40%, #BFDDD5 100%);
  }
  .texture {
    position: absolute; left: 0; width: 100%; top: var(--band); height: calc(100% - var(--band));
    opacity: .2; pointer-events: none;
    -webkit-mask-image: radial-gradient(62% 46% at 50% 40%, rgba(0,0,0,.12) 0%, rgba(0,0,0,.12) 55%, #000 100%);
    mask-image: radial-gradient(62% 46% at 50% 40%, rgba(0,0,0,.12) 0%, rgba(0,0,0,.12) 55%, #000 100%);
  }
  .band { position: relative; z-index: 1; flex: none; height: var(--band); background: var(--navy); overflow: hidden; }
  .band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .band::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,41,65,.84) 0%, rgba(0,41,65,.58) 48%, rgba(0,41,65,.42) 100%);
  }
  .seal {
    position: absolute; z-index: 1; left: 50%; top: calc((var(--band) - var(--k) * 68) / 2 - var(--k) * 39); transform: translateX(-50%);
    width: calc(var(--k) * 78); height: calc(var(--k) * 78);
    display: flex; align-items: center; justify-content: center;
  }
  .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal .mv {
    position: relative; display: flex; align-items: baseline; padding-right: 1px;
    font-family: 'Playfair Display', Georgia, serif; font-weight: 800;
    font-size: calc(var(--k) * 31); line-height: 1;
  }
  .seal .m { color: #fff; }
  .seal .v { color: var(--mint); font-style: italic; margin-left: calc(var(--k) * -7); }
  .body {
    position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 0 calc(var(--k) * 28); margin-top: calc(var(--k) * -68);
  }
  .photo {
    flex: none; width: calc(var(--k) * 136); height: calc(var(--k) * 136);
    border-radius: 50%; object-fit: cover; border: calc(var(--k) * 4) solid #fff;
    box-shadow: 0 14px 28px rgba(0,41,65,.22);
  }
  h1 {
    margin: calc(var(--k) * 16) 0 0; text-align: center; text-transform: uppercase;
    font-family: 'Cinzel', Georgia, serif; font-weight: 600;
    font-size: calc(var(--k) * 25); line-height: 1.15; letter-spacing: calc(var(--k) * 2.5);
  }
  .title {
    margin: calc(var(--k) * 12) 0 0; text-align: center; text-transform: uppercase;
    font-size: calc(var(--k) * 10.5); font-weight: 600; letter-spacing: calc(var(--k) * 1.5); line-height: 1.6;
  }
  .school { margin: calc(var(--k) * 5) 0 0; text-align: center; font-size: calc(var(--k) * 12); font-weight: 500; color: var(--petrol); }
  .btn {
    flex: none; align-self: stretch; display: flex; align-items: center; justify-content: center;
    gap: calc(var(--k) * 10); border-radius: calc(var(--k) * 14);
    color: var(--navy); text-decoration: none; -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(.96); }
  .btn svg { width: calc(var(--k) * 17); height: calc(var(--k) * 17); }
  .btn.save {
    margin-top: calc(var(--k) * 22); height: calc(var(--k) * 52); background: var(--coral);
    font-size: calc(var(--k) * 14); font-weight: 700; letter-spacing: .3px;
    position: relative; overflow: hidden;
    animation: halo 3.2s ease-in-out infinite;
  }
  .btn.save .shine {
    position: absolute; top: 0; bottom: 0; left: 0; width: 34%; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.42) 50%, rgba(255,255,255,0) 100%);
    animation: shine 4.8s ease-in-out infinite;
  }
  .btn.save svg { position: relative; animation: nudge 4.8s ease-in-out infinite; }
  .btn.save span:not(.shine) { position: relative; }
  @keyframes shine { 0%,62% { transform: translateX(-160%) skewX(-20deg); } 82%,100% { transform: translateX(420%) skewX(-20deg); } }
  @keyframes halo {
    0%,100% { box-shadow: 0 10px 22px rgba(253,110,110,.30), 0 0 0 0 rgba(253,110,110,.45); }
    50% { box-shadow: 0 12px 26px rgba(253,110,110,.36), 0 0 0 7px rgba(253,110,110,0); }
  }
  @keyframes nudge { 0%,70%,100% { transform: translateX(0); } 76% { transform: translateX(2px); } 82% { transform: translateX(-1px); } 88% { transform: translateX(0); } }
  @media (prefers-reduced-motion: reduce) { .btn.save, .btn.save * { animation: none !important; } }
  .btn.in {
    margin-top: calc(var(--k) * 10); height: calc(var(--k) * 48); background: #fff; box-shadow: 0 6px 16px rgba(0,41,65,.08);
    font-size: calc(var(--k) * 13); font-weight: 600; letter-spacing: .2px;
  }
  .quote { margin: auto 0 0; padding: calc(var(--k) * 18) 0 calc(var(--k) * 26); display: flex; flex-direction: column; align-items: center; gap: calc(var(--k) * 12); }
  .quote i { display: block; width: calc(var(--k) * 150); height: 1px; background: var(--petrol); opacity: .45; }
  .quote p {
    margin: 0; text-align: center; text-transform: uppercase;
    font-size: calc(var(--k) * 9.5); font-weight: 400; letter-spacing: calc(var(--k) * 1.4); line-height: 1.7; color: var(--petrol);
  }
  .quote strong { font-weight: 700; color: var(--navy); }
  @media (min-width: 520px) {
    body { align-items: center; padding: 24px 0; }
    .card { min-height: 0; height: min(760px, calc(100vh - 48px)); border-radius: 22px; box-shadow: 0 24px 60px rgba(0,41,65,.22); }
    :root { --k: min(1px, calc((100vh - 48px) / 640)); --vh: min(760px, calc(100vh - 48px)); }
  }
</style>
</head>
